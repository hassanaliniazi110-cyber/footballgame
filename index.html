<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"
  >
  <meta name="theme-color" content="#06120b">
  <title>Football Arena X</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="app">

    <header class="topbar">
      <div class="brand">
        ⚽ <span>FOOTBALL ARENA X</span>
      </div>

      <div class="stat">
        <small>GOALS</small>
        <strong id="score">0</strong>
      </div>

      <div class="stat">
        <small>LEVEL</small>
        <strong id="level">1</strong>
      </div>

      <div class="stat">
        <small>LIVES</small>
        <strong id="lives">5</strong>
      </div>
    </header>

    <nav class="modes">
      <button class="mode active" data-mode="penalty">
        ⚽ PENALTY
      </button>

      <button class="mode" data-mode="freekick">
        🎯 FREE KICK
      </button>

      <button class="mode" data-mode="longshot">
        🚀 LONG SHOT
      </button>

      <button class="mode" data-mode="keeper">
        🧤 GOALKEEPER
      </button>
    </nav>

    <section class="toolbar">

      <label class="difficulty">
        <span>Difficulty</span>

        <select id="difficulty">
          <option value="easy">Easy</option>
          <option value="normal" selected>Normal</option>
          <option value="hard">Hard</option>
        </select>
      </label>

      <label class="difficulty">
        <span>Player</span>

        <select id="playerSelect">
          <option>Cristiano Ronaldo</option>
          <option>Lionel Messi</option>
          <option>Kylian Mbappe</option>
          <option>Erling Haaland</option>
          <option>Mohamed Salah</option>
          <option>Neymar</option>
        </select>
      </label>

      <button id="restart" class="restart">
        RESTART
      </button>

      <div id="hint" class="hint">
        Pick a target and shoot!
      </div>

    </section>

    <main id="arena">

      <canvas id="gameCanvas"></canvas>

      <div id="message" class="message">
        CHOOSE YOUR SHOT
      </div>

      <div id="distance" class="distance">
        DISTANCE: 12 m
      </div>

      <div id="powerWrap" class="power-wrap">

        <div class="power-label">
          <span>SHOT POWER</span>
          <b id="powerText">75%</b>
        </div>

        <div class="power-track">
          <div id="powerFill"></div>
        </div>

      </div>

      <div id="controls" class="controls">

        <button data-zone="left">
          <span>↖</span>
          LEFT
        </button>

        <button data-zone="center">
          <span>↑</span>
          CENTER
        </button>

        <button data-zone="right">
          <span>↗</span>
          RIGHT
        </button>

      </div>

      <button id="diveButton" class="dive" hidden>
        🧤 DIVE NOW
      </button>

      <div id="resultCard" class="result-card" hidden>

        <div id="resultTitle">
          GOAL!
        </div>

        <div id="resultSub">
          Great finish.
        </div>

        <button id="continueBtn">
          CONTINUE
        </button>

      </div>

    </main>

    <footer>
      <span id="modeText">Penalty Kick</span>
      <span>•</span>
      <span id="footerText">
        3 goals = next level
      </span>
    </footer>

  </div>

  <script src="script.js"></script>
</body>
</html>
