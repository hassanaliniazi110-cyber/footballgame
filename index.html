<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta name="theme-color" content="#06180d">

  <title>Football Legends Arena</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="app">

  <!-- TOP BAR -->
  <header class="topbar">

    <div class="brand">

      <div class="brand-main">
        ⚽ FOOTBALL LEGENDS ARENA
      </div>

      <div class="brand-sub">
        PENALTY • FREE KICK • LONG SHOT • GOALKEEPER
      </div>

    </div>


    <div class="stats">

      <div class="stat">
        <span>SCORE</span>
        <strong id="score">0</strong>
      </div>

      <div class="stat">
        <span>LEVEL</span>
        <strong id="level">1</strong>
      </div>

      <div class="stat">
        <span>GOALS</span>
        <strong id="goals">0</strong>
      </div>

      <div class="stat">
        <span>SAVES</span>
        <strong id="saves">0</strong>
      </div>

      <div class="stat">
        <span>STREAK</span>
        <strong id="streak">0</strong>
      </div>

    </div>

  </header>


  <!-- PLAYER SETTINGS -->
  <section class="selection-panel">

    <div class="select-group">

      <label for="playerSelect">
        PLAYER
      </label>

      <select id="playerSelect">

        <option>Hassan Ali</option>
        <option>Ehan Ali</option>
        <option>Umar Shoaib</option>

        <option>Cristiano Ronaldo</option>
        <option>Lionel Messi</option>
        <option>Kylian Mbappé</option>
        <option>Erling Haaland</option>
        <option>Neymar Jr.</option>
        <option>Mohamed Salah</option>
        <option>Vinícius Júnior</option>
        <option>Jude Bellingham</option>
        <option>Kevin De Bruyne</option>
        <option>Robert Lewandowski</option>
        <option>Lamine Yamal</option>
        <option>Harry Kane</option>
        <option>Son Heung-min</option>
        <option>Rodri</option>
        <option>Antoine Griezmann</option>
        <option>Ousmane Dembélé</option>
        <option>Jamal Musiala</option>
        <option>Phil Foden</option>
        <option>Raphinha</option>

      </select>

    </div>


    <div class="select-group">

      <label for="keeperSelect">
        GOALKEEPER
      </label>

      <select id="keeperSelect">

        <option>Hassan Ali</option>

        <option>Ehan Ali</option>
        <option>Thibaut Courtois</option>
        <option>Alisson</option>
        <option>Manuel Neuer</option>
        <option>Gianluigi Donnarumma</option>
        <option>Ederson</option>
        <option>Jan Oblak</option>
        <option>Marc-André ter Stegen</option>
        <option>Emiliano Martínez</option>

      </select>

    </div>


    <div class="select-group">

      <label for="difficulty">
        DIFFICULTY
      </label>

      <select id="difficulty">

        <option value="easy">
          Easy
        </option>

        <option value="normal" selected>
          Normal
        </option>

        <option value="hard">
          Hard
        </option>

        <option value="legend">
          Legend
        </option>

      </select>

    </div>


    <div class="select-group">

      <label for="cameraSelect">
        CAMERA
      </label>

      <select id="cameraSelect">

        <option value="broadcast" selected>
          Broadcast
        </option>

        <option value="close">
          Close
        </option>

        <option value="wide">
          Wide
        </option>

      </select>

    </div>

  </section>


  <!-- MODES -->
  <nav class="mode-bar">

    <button
      class="mode active"
      data-mode="penalty"
    >
      ⚽ PENALTY
    </button>

    <button
      class="mode"
      data-mode="freekick"
    >
      🎯 FREE KICK
    </button>

    <button
      class="mode"
      data-mode="longshot"
    >
      💥 LONG SHOT
    </button>

    <button
      class="mode"
      data-mode="keeper"
    >
      🧤 GOALKEEPER
    </button>

  </nav>


  <!-- GAME -->
  <main id="gameArea">

    <canvas
      id="gameCanvas"
    ></canvas>


    <!-- HUD -->
    <div class="hud">

      <div class="glass-card player-card">

        <strong id="selectedPlayer">
          Hassan Ali
        </strong>

        <span id="selectedKeeper">
          vs Hassan Ali
        </span>

      </div>


      <div class="glass-card center-card">

        <div id="modeTitle">
          PENALTY
        </div>

        <strong id="message">
          CHOOSE YOUR SHOT
        </strong>

        <span id="distance">
          Distance: 11 m
        </span>

      </div>


      <div class="glass-card info-card">

        <span>
          BEST STREAK
        </span>

        <strong id="bestStreak">
          0
        </strong>

      </div>

    </div>


    <!-- LONG SHOT TARGET INFO -->
    <div
      id="targetInfo"
      class="target-info hidden"
    >
      TARGET: TAP ANYWHERE IN THE GOAL
    </div>


    <!-- POWER -->
    <div
      id="powerMeter"
      class="power-meter hidden"
    >

      <div class="power-label">
        POWER
      </div>

      <div class="power-bar">

        <div id="powerFill"></div>

      </div>

    </div>


    <!-- SHOOT CONTROLS -->
    <div
      id="shootControls"
      class="controls"
    >

      <button
        class="control-btn"
        data-zone="left"
      >

        <span class="big-arrow">
          ↖
        </span>

        <span>
          LEFT
        </span>

      </button>


      <button
        class="control-btn"
        data-zone="center"
      >

        <span class="big-arrow">
          ↑
        </span>

        <span>
          CENTER
        </span>

      </button>


      <button
        class="control-btn"
        data-zone="right"
      >

        <span class="big-arrow">
          ↗
        </span>

        <span>
          RIGHT
        </span>

      </button>

    </div>


    <!-- GOALKEEPER CONTROLS -->
    <div
      id="keeperControls"
      class="controls hidden"
    >

      <button
        class="control-btn save-btn"
        data-zone="left"
      >
        ↖ DIVE LEFT
      </button>

      <button
        class="control-btn save-btn"
        data-zone="center"
      >
        ↑ CENTER
      </button>

      <button
        class="control-btn save-btn"
        data-zone="right"
      >
        ↗ DIVE RIGHT
      </button>

    </div>


    <!-- LONG SHOT BUTTON -->
    <button
      id="longShotButton"
      class="long-shot-button hidden"
    >
      💥 SHOOT
    </button>


    <div
      id="tip"
      class="tip"
    >
      Tap LEFT, CENTER or RIGHT to shoot.
    </div>


    <div
      id="flash"
      class="flash"
    ></div>

  </main>


  <!-- FOOTER -->
  <footer class="footer">

    <button id="restart">
      🔄 RESTART
    </button>

    <span>
      Score 3 goals to level up
    </span>

  </footer>

</div>


<script src="script.js"></script>

</body>
</html>
