<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
      maximum-scale=1.0, user-scalable=no">

<title>Football Legends Arena</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div id="app">

    <header class="topbar">
        <div class="brand">
            ⚽ FOOTBALL
            <span>LEGENDS ARENA</span>
        </div>

        <div class="stat">
            <small>SCORE</small>
            <strong id="score">0</strong>
        </div>

        <div class="stat">
            <small>LEVEL</small>
            <strong id="level">1</strong>
        </div>

        <div class="stat">
            <small>GOALS</small>
            <strong id="goals">0</strong>
        </div>
    </header>


    <section class="selectionPanel">

        <div class="selectionGroup">
            <label>PLAYER</label>

            <select id="playerSelect">
                <option value="Hassan Ali">Hassan Ali</option>
                <option value="Ehan Ali">Ehan Ali</option>
                <option value="Umar Shoaib">Umar Shoaib</option>
                <option value="Cristiano Ronaldo">Cristiano Ronaldo</option>
            </select>
        </div>


        <div class="selectionGroup">
            <label>GOALKEEPER</label>

            <select id="keeperSelect">
                <option value="Ehan Ali">Ehan Ali</option>
                <option value="Thibaut Courtois">Thibaut Courtois</option>
                <option value="Alisson">Alisson</option>
                <option value="Manuel Neuer">Manuel Neuer</option>
                <option value="Gianluigi Donnarumma">
                    Gianluigi Donnarumma
                </option>
            </select>
        </div>


        <div class="selectionGroup">
            <label>DIFFICULTY</label>

            <select id="difficulty">
                <option value="easy">Easy</option>
                <option value="normal" selected>Normal</option>
                <option value="hard">Hard</option>
            </select>
        </div>

    </section>


    <nav class="modeBar">

        <button class="mode active" data-mode="penalty">
            ⚽ PENALTY
        </button>

        <button class="mode" data-mode="freekick">
            🎯 FREE KICK
        </button>

        <button class="mode" data-mode="keeper">
            🧤 GOALKEEPER
        </button>

    </nav>


    <main id="gameArea">

        <canvas id="gameCanvas"></canvas>

        <div id="hud">

            <div class="playerCard">
                <span id="selectedPlayer">
                    Hassan Ali
                </span>

                <small id="selectedKeeper">
                    vs Ehan Ali
                </small>
            </div>

            <div id="message">
                CHOOSE YOUR SHOT
            </div>

            <div id="distance">
                Distance: 11 m
            </div>

        </div>


        <div id="shootControls">

            <button data-zone="left">
                ↖
                <span>LEFT</span>
            </button>

            <button data-zone="center">
                ↑
                <span>CENTER</span>
            </button>

            <button data-zone="right">
                ↗
                <span>RIGHT</span>
            </button>

        </div>


        <div id="keeperControls">

            <button data-save="left">↖ LEFT</button>
            <button data-save="center">↑ CENTER</button>
            <button data-save="right">↗ RIGHT</button>

        </div>

    </main>


    <footer>

        <button id="restart">
            🔄 RESTART
        </button>

        <span>
            Score 3 goals to level up
        </span>

    </footer>

</div>

<script src="script.js"></script>

</body>
</html>
